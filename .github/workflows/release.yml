name: Release Agare.app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v.1.0.1)"
        required: true
        default: "v.1.0.1"

permissions:
  contents: write

jobs:
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Agare.app
        run: |
          xcodebuild \
            -project macos/Agare.xcodeproj \
            -scheme Agare \
            -configuration Release \
            -derivedDataPath macos/DerivedData \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=NO
      - name: Zip Agare.app
        run: |
          APP="macos/DerivedData/Build/Products/Release/Agare.app"
          test -d "$APP"
          codesign --force --deep --sign - "$APP" || true
          ditto -c -k --keepParent "$APP" Agare.app.zip
          ls -lh Agare.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Agare.app
          path: Agare.app.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NOTES="$(cat <<'EOF'
          ## Install (Mac)

          1. Download **Agare.app.zip** below.
          2. Unzip, then drag **Agare** into **Applications**.
          3. Right-click Agare → **Open** (the first time only).
          4. In the Agare window, click **Turn on in Safari…** and enable it.

          If Safari hides it: Safari → Settings → Developer → Allow unsigned extensions, then try again.
          EOF
          )"
          echo "Publishing to tag $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Agare.app.zip --clobber
            echo "Attached Agare.app.zip to existing $TAG"
          else
            gh release create "$TAG" Agare.app.zip \
              --title "Agare $TAG" \
              --notes "$NOTES" \
            || gh release upload "$TAG" Agare.app.zip --clobber
          fi